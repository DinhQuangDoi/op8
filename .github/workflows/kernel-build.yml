name: Kernel Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      debug:
        description: 'Enable debug mode'
        required: false
        default: 'false'

env:
  DEVICE_CODENAME: op8
  ARCH: arm64
  DEFCONFIG: op8_defconfig
  TOOLCHAIN_TYPE: clang
  KERNEL_VERSION: 4.19

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        submodules: recursive
    
    - name: Install dependencies
      run: |
        sudo apt-get update && sudo apt-get install -y \
          build-essential \
          bc \
          binutils \
          gcc-aarch64-linux-gnu \
          git \
          curl \
          xz-utils \
          zip \
          python3 \
          python3-pip
        pip3 install --user pyyaml
    
    - name: Setup toolchain
      run: |
        mkdir -p toolchain
        cd toolchain

        # Download official LLVM/Clang 17.0.6 (matches blu_spark clang)
        curl -sL "https://github.com/llvm/llvm-project/releases/download/llvmorg-17.0.6/clang+llvm-17.0.6-x86_64-linux-gnu-ubuntu-22.04.tar.xz" -o llvm.tar.xz
        tar -xJf llvm.tar.xz
        rm llvm.tar.xz
        mv clang+llvm-* clang
        echo "PATH=$(pwd)/clang/bin:$PATH" >> $GITHUB_ENV

    - name: Download AnyKernel3
      if: true
      run: |
        git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git anykernel3 || true
    
    - name: Verify KSU Integration
      run: |
        echo "Checking for KSU integration..."
        if [ -d "drivers/kernelsu" ]; then
          echo "KSU found in drivers/kernelsu/"
        else
          echo "KSU not integrated yet"
        fi
    
    - name: Build kernel
      run: |
        make O=out ARCH=arm64 \
          CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- op8_defconfig

        # Build with all cores
        make O=out -j$(nproc) ARCH=arm64 \
          CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu-
    
    - name: Package AnyKernel3
      run: |
        cd AnyKernel3
        # Copy kernel Image
        if [ -f ../out/arch/arm64/boot/Image ]; then
          cp ../out/arch/arm64/boot/Image .
        elif [ -f ../out/Image ]; then
          cp ../out/Image .
        fi
        
        # Copy dtbs if exists
        if [ -d ../out/arch/arm64/boot/dts ]; then
          mkdir -p dtbs
          cp ../out/arch/arm64/boot/dts/*/*.dtb dtbs/ 2>/dev/null || true
        fi
        
        # Create zip
        zip -r kernel.zip *
        
        echo "KERNEL_ZIP=kernel.zip" >> $GITHUB_ENV
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: kernel-artifacts
        path: |
          AnyKernel3/kernel.zip
          out/arch/arm64/boot/Image
          out/vmlinux
          out/Module.symvers
        if-no-files-found: ignore

    - name: Build Summary
      run: |
        echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
        echo "- Device: ${{ env.DEVICE_CODENAME }}" >> $GITHUB_STEP_SUMMARY
        echo "- Kernel: ${{ env.KERNEL_VERSION }}" >> $GITHUB_STEP_SUMMARY
        echo "- Architecture: ${{ env.ARCH }}" >> $GITHUB_STEP_SUMMARY
        echo "- Toolchain: ${{ env.TOOLCHAIN_TYPE }}" >> $GITHUB_STEP_SUMMARY
