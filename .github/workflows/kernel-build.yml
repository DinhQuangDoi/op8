name: Kernel Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      debug:
        description: 'Enable debug mode'
        required: false
        default: 'false'

env:
  DEVICE_CODENAME: op8
  ARCH: arm64
  DEFCONFIG: op8_defconfig
  TOOLCHAIN_TYPE: clang
  KERNEL_VERSION: 4.19

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        submodules: recursive
    
    - name: Install dependencies
      run: |
        sudo apt-get update && sudo apt-get install -y \
          build-essential \
          bc \
          binutils \
          git \
          curl \
          xz-utils \
          zip \
          python3 \
          python3-pip
        pip3 install --user pyyaml
    
    - name: Setup toolchain
      run: |
        mkdir -p toolchain
        cd toolchain
        
        # Download Proton Clang
        curl -sL "https://github.com/kdrag0n/proton-clang/releases/download/proton-clang@20240901/clang.tar.zst" | tar -xJ
        echo "CLANG_PATH=$(pwd)/clang" >> $GITHUB_ENV
        echo "PATH=$(pwd)/clang/bin:$PATH" >> $GITHUB_ENV

    - name: Download AnyKernel3
      if: true
      run: |
        git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git anykernel3 || true
    
    - name: Verify KSU Integration
      run: |
        echo "Checking for KSU integration..."
        if [ -d "drivers/kernelsu" ]; then
          echo "KSU found in drivers/kernelsu/"
        else
          echo "KSU not integrated yet"
        fi
    
    - name: Build kernel
      run: |
        make op8_defconfig ARCH=arm64
        
        # Build with all cores
        make -j$(nproc) ARCH=arm64 \
          CC=${CLANG_PATH:-${GCC_PATH}}/bin/clang \
          CLANG_TRIPLE=aarch64-linux-gnu- \
          CROSS_COMPILE=${CROSS_COMPILE:-aarch64-linux-gnu-} \
          || make -j$(nproc) ARCH=arm64
    
    - name: Package AnyKernel3
      run: |
        cd AnyKernel3
        # Copy kernel Image
        if [ -f ../arch/arm64/boot/Image ]; then
          cp ../arch/arm64/boot/Image .
        elif [ -f ../Image ]; then
          cp ../Image .
        fi
        
        # Copy dtbs if exists
        if [ -d ../arch/arm64/boot/dts ]; then
          mkdir -p dtbs
          cp ../arch/arm64/boot/dts/*/*.dtb dtbs/ 2>/dev/null || true
        fi
        
        # Create zip
        zip -r kernel.zip *
        
        echo "KERNEL_ZIP=kernel.zip" >> $GITHUB_ENV
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: kernel-artifacts
        path: |
          AnyKernel3/kernel.zip
          arch/arm64/boot/Image
          vmlinux
          Module.symvers
        if-no-files-found: ignore

    - name: Build Summary
      run: |
        echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
        echo "- Device: ${{ env.DEVICE_CODENAME }}" >> $GITHUB_STEP_SUMMARY
        echo "- Kernel: ${{ env.KERNEL_VERSION }}" >> $GITHUB_STEP_SUMMARY
        echo "- Architecture: ${{ env.ARCH }}" >> $GITHUB_STEP_SUMMARY
        echo "- Toolchain: ${{ env.TOOLCHAIN_TYPE }}" >> $GITHUB_STEP_SUMMARY
